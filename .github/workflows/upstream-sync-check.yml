name: Upstream Sync Check

on:
  schedule:
    - cron: "0 6 * * 1" # Weekly on Monday at 06:00 UTC
  workflow_dispatch:
    inputs:
      post_issue:
        description: "Create or update the weekly upstream sync digest issue"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-sync-check
  cancel-in-progress: true

jobs:
  check-upstream:
    name: Measure upstream drift (can1357/oh-my-pi)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout mars-agent (full history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Fetch upstream and compute sync report
        id: report
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/can1357/oh-my-pi.git 2>/dev/null || \
            git remote set-url upstream https://github.com/can1357/oh-my-pi.git
          git fetch --no-tags upstream main

          MB=$(git merge-base HEAD upstream/main)
          UPSTREAM_HEAD=$(git rev-parse --short upstream/main)
          LOCAL_HEAD=$(git rev-parse --short HEAD)
          BEHIND_ALL=$(git rev-list --count "$MB"..upstream/main)
          BEHIND_NON_MERGE=$(git rev-list --no-merges --count "$MB"..upstream/main)
          AHEAD_ALL=$(git rev-list --count "$MB"..HEAD)

          # Identify recent upstream non-merge commits touching only files untouched locally
          git diff --name-only "$MB"..HEAD | sort -u > /tmp/local-touched.txt
          python3 - "$MB" /tmp/local-touched.txt > /tmp/clean-candidates.txt <<'PY'
          import subprocess, sys, os

          mb, touched_path = sys.argv[1], sys.argv[2]
          with open(touched_path, "r", encoding="utf-8") as f:
              local_touched = {line.strip() for line in f if line.strip()}

          out = subprocess.check_output(
              ["git", "log", "--no-merges", "-n", "200", "--format=\x01%h %s", "--name-only", f"{mb}..upstream/main"],
              text=True,
              errors="replace",
          )
          candidates = []
          for block in out.split("\x01"):
              lines = [l.strip() for l in block.splitlines() if l.strip()]
              if not lines:
                  continue
              header, files = lines[0], lines[1:]
              if not files:
                  continue
              if all(os.path.exists(p) and p not in local_touched for p in files):
                  candidates.append((header, len(files)))
          for header, count in candidates[:25]:
              print(f"- `{header}` ({count} file{'s' if count != 1 else ''})")
          if not candidates:
              print("- _No clean single-commit candidates in the latest 200 upstream commits._")
          PY

          cat > /tmp/upstream-sync-report.md <<EOF
          ## Weekly Upstream Sync Digest (\`can1357/oh-my-pi\`)

          | Metric | Value |
          | --- | --- |
          | Local \`main\` | \`${LOCAL_HEAD}\` |
          | Upstream \`main\` | \`${UPSTREAM_HEAD}\` |
          | Merge-base | \`${MB:0:10}\` |
          | Commits behind (total / non-merge) | \`${BEHIND_ALL}\` / \`${BEHIND_NON_MERGE}\` |
          | Local commits ahead | \`${AHEAD_ALL}\` |

          ### Clean cherry-pick candidates (latest 200 upstream commits, untouched files only)

          $(cat /tmp/clean-candidates.txt)

          ---
          See \`docs/upstream-migration.md\` for the full cherry-pick and full-migration recipe.
          > Always inspect parent commits before cherry-picking so tests and implementations stay paired.
          EOF

          cat /tmp/upstream-sync-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update tracking issue (scheduled runs or explicit opt-in)
        if: github.event_name == 'schedule' || inputs.post_issue == true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="[Upstream Sync] Weekly digest"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"${TITLE}\"" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body-file /tmp/upstream-sync-report.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label "enhancement" --body-file /tmp/upstream-sync-report.md
          fi
