name: Mars PR Auto-Reviewer

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  auto-review:
    name: Autonomous Code & Security Review
    # Don't run review on bot's own automated PRs to avoid review loops
    if: "!startsWith(github.head_ref, 'mars-bot/')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Run Mars PR Reviewer
        env:
          MARS_LLM_URL: ${{ secrets.MARS_LLM_URL || '' }}
          MARS_LLM_API_KEY: ${{ secrets.MARS_LLM_API_KEY || '' }}
          MARS_MODEL: ${{ vars.MARS_MODEL || 'gpt-4o' }}
          GITHUB_TOKEN: ${{ secrets.MARS_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          REPO_TYPE: "mars-agent"
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          bun run .github/scripts/mars-pr-reviewer.mjs
