name: Mars Bot Auto-Coder

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Task instructions for Mars Bot"
        required: true
        type: string
        default: "Run health checks and fix any broken types or tests"
      issue_number:
        description: "Associated Issue / PR Number (optional)"
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: mars-bot-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  mars-bot:
    name: Mars Bot Agent
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association) &&
       contains(github.event.issue.body, '@mars-bot')) ||
      (github.event_name == 'issue_comment' &&
       contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) && (
         contains(github.event.comment.body, '@mars-bot') ||
         startsWith(github.event.comment.body, '/fix') ||
         startsWith(github.event.comment.body, '/code')
      )) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) && (
         contains(github.event.comment.body, '@mars-bot') ||
         startsWith(github.event.comment.body, '/fix')
      ))

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.MARS_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          # Pin the checkout to the base branch. On `pull_request_review_comment`
          # the default checkout is the PR merge commit, so `.github/scripts/
          # mars-bot-runner.mjs` would come from the PR author and run with
          # `contents: write` and the bot PAT in the environment. The bot always
          # pushes its own branch, so working from the base tree costs nothing.
          ref: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: nightly-2026-10-06

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Configure Git Identity
        run: |
          git config --global user.name "mars-bot[bot]"
          git config --global user.email "mars-bot@users.noreply.github.com"

      - name: Run Mars Bot Agent
        env:
          MARS_LLM_URL: ${{ secrets.MARS_LLM_URL || '' }}
          MARS_LLM_API_KEY: ${{ secrets.MARS_LLM_API_KEY || '' }}
          MARS_MODEL: ${{ vars.MARS_MODEL || 'gpt-4o' }}
          MARS_BOT_TOKEN: ${{ secrets.MARS_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.MARS_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          REPO_TYPE: "mars-agent"
          INPUT_PROMPT: ${{ github.event.inputs.prompt }}
          INPUT_ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
        run: |
          bun run .github/scripts/mars-bot-runner.mjs
