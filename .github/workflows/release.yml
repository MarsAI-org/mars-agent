name: Release (Manual Fallback)

# Manual workflow_dispatch fallback / dry-run pipeline (glibc, darwin, win32 only).
#
# `ci.yml` is the single authoritative release pipeline for `v*` tags: it runs
# full validation, Bazel musl cross-targets, macOS Developer ID signing and
# notarization, browser-relay packaging, THIRD-PARTY-NOTICES.txt, and curated
# release notes. This workflow never triggers on tag pushes; it exists only for
# manual dry-runs or emergency non-Bazel fallback builds.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build and test without publishing GitHub Release)"
        required: true
        type: boolean
        default: true
      release_tag:
        description: "Explicit semver release tag (e.g. v0.3.2) required when dry_run is false"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release_metadata:
    name: Resolve release metadata
    runs-on: ubuntu-22.04
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      is_dry_run: ${{ steps.meta.outputs.is_dry_run }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - id: meta
        shell: bash
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          DRY_RUN="${INPUT_DRY_RUN:-true}"
          TAG="${INPUT_RELEASE_TAG:-}"
          if [ "$DRY_RUN" = "true" ]; then
            TAG="${TAG:-v0.1.0-dryrun}"
          else
            # Never publish a placeholder tag such as v0.1.0-dryrun; require an
            # explicit semver vX.Y.Z tag for any live manual release.
            if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[A-Za-z0-9.]+)?$ ]] || [[ "$TAG" == *-dryrun* ]]; then
              echo "::error::Non-dry-run release requires an explicit semver release_tag (e.g. v0.3.2); refusing '$TAG'"
              exit 1
            fi
          fi
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *"-rc"* ]] || [[ "$TAG" == *"-canary"* ]] || [[ "$TAG" == *"-beta"* ]] || [[ "$TAG" == *"-alpha"* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build_native:
    name: "Build native addon: ${{ matrix.target_id }}"
    runs-on: ${{ matrix.os }}
    needs: [release_metadata]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target_id: linux-x64
            cargo_profile: ci
          - os: ubuntu-24.04-arm
            target_id: linux-arm64
            cargo_profile: ci
          - os: macos-15-intel
            target_id: darwin-x64
            cargo_profile: ci
          - os: macos-14
            target_id: darwin-arm64
            cargo_profile: ci
          - os: windows-2025
            target_id: win32-x64
            cargo_profile: ci
          - os: windows-11-arm
            target_id: win32-arm64
            cargo_profile: ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build native addon
        env:
          MARS_NATIVE_CARGO_PROFILE: ${{ matrix.cargo_profile }}
        run: bun --cwd=packages/natives run build:bindings
      - name: Upload native addon
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: native-${{ matrix.target_id }}
          path: packages/natives/native/*.node

  build_binary:
    name: "Build binary: ${{ matrix.target_id }}"
    runs-on: ${{ matrix.os }}
    needs: [release_metadata, build_native]
    strategy:
      fail-fast: false
      matrix:
        # Manual fallback covers glibc/darwin/win32 only. Linux musl targets
        # require Bazel musl cross-compiled native addons and are built
        # exclusively by the authoritative release pipeline in `ci.yml`.
        include:
          - os: ubuntu-22.04
            target_id: linux-x64
            native_id: linux-x64
            binary_name: mars-linux-x64
          - os: ubuntu-24.04-arm
            target_id: linux-arm64
            native_id: linux-arm64
            binary_name: mars-linux-arm64
          - os: macos-15-intel
            target_id: darwin-x64
            native_id: darwin-x64
            binary_name: mars-darwin-x64
          - os: macos-14
            target_id: darwin-arm64
            native_id: darwin-arm64
            binary_name: mars-darwin-arm64
          - os: windows-2025
            target_id: win32-x64
            native_id: win32-x64
            binary_name: mars-windows-x64.exe
          - os: windows-11-arm
            target_id: win32-arm64
            native_id: win32-arm64
            binary_name: mars-windows-arm64.exe
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download native addon
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: native-${{ matrix.native_id }}
          path: packages/natives/native
      - name: Build release binary
        env:
          RELEASE_TARGETS: ${{ matrix.target_id }}
        run: bun run ci:release:build-binaries
      - name: Upload binary artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: binary-${{ matrix.target_id }}
          path: packages/coding-agent/binaries/${{ matrix.binary_name }}

  smoke_test:
    name: "Smoke test: ${{ matrix.target_id }}"
    runs-on: ${{ matrix.os }}
    needs: [build_binary]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target_id: linux-x64
            binary_name: mars-linux-x64
          - os: ubuntu-24.04-arm
            target_id: linux-arm64
            binary_name: mars-linux-arm64
          - os: macos-15-intel
            target_id: darwin-x64
            binary_name: mars-darwin-x64
          - os: macos-14
            target_id: darwin-arm64
            binary_name: mars-darwin-arm64
          - os: windows-2025
            target_id: win32-x64
            binary_name: mars-windows-x64.exe
          - os: windows-11-arm
            target_id: win32-arm64
            binary_name: mars-windows-arm64.exe
    steps:
      - name: Download binary
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: binary-${{ matrix.target_id }}
          path: bin
      - name: Test (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        env:
          BINARY: bin/${{ matrix.binary_name }}
        run: |
          set -euo pipefail
          chmod +x "$BINARY"
          runtime_dir="$(mktemp -d)"
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "$BINARY" --version
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "$BINARY" --help
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "$BINARY" --smoke-test
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "$BINARY" --platform-check --json
      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BINARY: bin/${{ matrix.binary_name }}
        run: |
          $runtimeDir = Join-Path $env:RUNNER_TEMP "mars-smoke"
          $env:HOME = Join-Path $runtimeDir "home"
          $env:USERPROFILE = $env:HOME
          $env:LOCALAPPDATA = Join-Path $runtimeDir "local"
          $env:XDG_DATA_HOME = Join-Path $runtimeDir "xdg"
          New-Item -ItemType Directory -Force -Path $env:HOME, $env:LOCALAPPDATA, $env:XDG_DATA_HOME | Out-Null
          & $env:BINARY --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:BINARY --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:BINARY --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:BINARY --platform-check --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  publish_release:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: [release_metadata, smoke_test]
    if: needs.release_metadata.outputs.is_dry_run != 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download all binaries
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          pattern: binary-*
          path: release-assets
          merge-multiple: true
      - name: Generate Checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum mars-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ needs.release_metadata.outputs.release_tag }}
          prerelease: ${{ needs.release_metadata.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-assets/*
            LICENSE
