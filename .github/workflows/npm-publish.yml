name: npm publish

# Bootstrap publish of the @marsai-org packages.
#
# Authenticates with the repository secret NPM_TOKEN, referenced by name only —
# no token value is ever read, printed, or stored by this repository. Prefer
# `npm-publish-trusted.yml` once a Trusted Publisher is configured for every
# package; this workflow is the path for the first publish, where no package has
# a trusted publisher yet.
#
# Credential hygiene: every install, build, and pack step runs BEFORE any
# credential exists. `--pack-only` runs each package's `prepack` build, so it
# must not see the token; the steps that carry the token run only `npm whoami` /
# `npm view` / `npm publish` on the already-built tarballs — no repository
# script, no lifecycle script. `--ignore-scripts` makes that explicit.
#
# The preflight step always runs, including on a dry run, so an operator can see
# whether the credential is configured before flipping `dry_run` to false.
#
# Triggers are `workflow_dispatch` and `v*` tag pushes only. A pull request can
# never trigger it, and the job itself refuses to run outside main or a `v*` tag,
# so a branch push cannot publish.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and validate without publishing"
        required: true
        type: boolean
        default: true
      dist_tag:
        description: "npm dist-tag to publish under (never moves `latest` on its own)"
        required: true
        type: string
        default: next
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @marsai-org packages
    # Publishing is only possible from main or a release tag.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      # Required so npm can mint a provenance attestation.
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      # npm runs under Bun when the release tooling shells out to it; pin a
      # version that supports provenance and OIDC.
      - name: Install a publishing npm
        run: npm install -g npm@11.17.0
      # ---- Everything below runs with no credential in scope. ----
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # coding-agent's `prepack` loads the Linux x64 addon, so it must exist
      # before packing. Built from source: this workflow is standalone and has no
      # native-artifact job to download from.
      - name: Build the native addon
        env:
          MARS_NATIVE_CARGO_PROFILE: ci
        run: bun --cwd=packages/natives run build:bindings
      - name: Resolve publish mode
        id: mode
        shell: bash
        env:
          DISPATCH_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          DISPATCH_DIST_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.dist_tag || 'next' }}
        run: |
          echo "PACK_DIR=$RUNNER_TEMP/mars-npm-pack" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dry_run=$DISPATCH_DRY_RUN" >> "$GITHUB_OUTPUT"
            echo "dist_tag=$DISPATCH_DIST_TAG" >> "$GITHUB_OUTPUT"
          else
            # A `v*` tag publishes for real. Stable tags target `latest`;
            # prerelease tags target `next`, so a release candidate can never
            # move `latest` on its own.
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            case "${GITHUB_REF_NAME}" in
              *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT" ;;
              *)   echo "dist_tag=latest" >> "$GITHUB_OUTPUT" ;;
            esac
          fi
      # Packing runs each package's `prepack` build, so it stays out of the
      # credential steps. The tarballs are written under $PACK_DIR.
      - name: Pack the packages (no credentials)
        env:
          DIST_TAG: ${{ steps.mode.outputs.dist_tag }}
        run: bun scripts/ci-release-publish.ts --pack-only "$PACK_DIR" --dist-tag "$DIST_TAG"
      # Always runs, including on a dry run, so the operator can see whether the
      # credential is configured before flipping `dry_run`. Reports presence with
      # `test -n` and prints `npm whoami` — never the token, never the environment.
      - name: Preflight the publish credential
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then echo "NPM_TOKEN: present"; else echo "NPM_TOKEN: missing"; fi
          echo "npm whoami: $(npm whoami 2>&1 || echo '<failed>')"
      # The publish step. Runs only `npm publish` on the tarballs produced above,
      # in dependency order, skipping versions that already exist so reruns are
      # idempotent. No repository script and no lifecycle script run here.
      - name: Publish to npm
        if: steps.mode.outputs.dry_run != 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::warning title=npm publish skipped::NPM_TOKEN is missing, so nothing was published. Configure the secret and re-run."
            exit 0
          fi
          manifest="$PACK_DIR/publish-manifest.tsv"
          if [ ! -f "$manifest" ]; then
            echo "::error title=npm publish::publish manifest not found at $manifest"
            exit 1
          fi
          failed=0
          while IFS=$'\t' read -r name version tag tarball; do
            [ -n "$name" ] || continue
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "Skipping ${name}@${version} (already published)"
              continue
            fi
            echo "Publishing ${name}@${version} (tag ${tag})"
            out="$(npm publish "$tarball" --access public --tag "$tag" --ignore-scripts --provenance 2>&1)"
            rc=$?
            [ -n "$out" ] && echo "$out"
            if [ "$rc" -ne 0 ]; then
              # A concurrent publisher may win after the preflight above; that is
              # not a failure. Any other error is.
              if printf '%s' "$out" | grep -qiE "E409|EPUBLISHCONFLICT|cannot publish over"; then
                echo "Skipping ${name}@${version} (already published)"
              else
                echo "::error title=npm publish::failed to publish ${name}@${version}"
                failed=1
              fi
            fi
          done < "$manifest"
          exit "$failed"
      - name: Report dry run
        if: steps.mode.outputs.dry_run == 'true'
        run: |
          echo "Dry run: packages were built and packed but nothing was published."
          echo "Manifest written to $PACK_DIR/publish-manifest.tsv"
          cat "$PACK_DIR/publish-manifest.tsv"
