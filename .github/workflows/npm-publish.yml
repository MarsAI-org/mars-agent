name: npm publish

# Bootstrap publish of the @marsai-org packages.
#
# Authenticates with the repository secret NPM_TOKEN, referenced by name only —
# no token value is ever read, printed, or stored by this repository. Prefer
# `npm-publish-trusted.yml` once a Trusted Publisher is configured for every
# package; this workflow is the path for the first publish, where no package has
# a trusted publisher yet.
#
# Triggers are `workflow_dispatch` and `v*` tag pushes only. A pull request can
# never trigger it, and the job itself refuses to run outside main or a `v*` tag,
# so a branch push cannot publish.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and validate without publishing"
        required: true
        type: boolean
        default: true
      dist_tag:
        description: "npm dist-tag to publish under (CI never moves `latest` on its own)"
        required: true
        type: string
        default: next
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @marsai-org packages
    # Publishing is only possible from main or a release tag.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      # Required so npm can mint a provenance attestation.
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      # The release script shells out to `npm publish`, and npm 12 needs a newer
      # Node than Bun 1.3 emulates. Pin a version that supports provenance.
      - name: Install a publishing npm
        run: npm install -g npm@11.17.0
      # Everything up to the publish step runs with no credential in scope.
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # coding-agent's `prepack` loads the Linux x64 addon, so it must exist
      # before publishing. Built from source: this workflow is standalone and has
      # no native-artifact job to download from.
      - name: Build the native addon
        env:
          MARS_NATIVE_CARGO_PROFILE: ci
        run: bun --cwd=packages/natives run build:bindings
      - name: Resolve publish mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
            echo "dist_tag=${{ inputs.dist_tag }}" >> "$GITHUB_OUTPUT"
          else
            # A `v*` tag publishes for real: stable tags target `latest`,
            # prerelease tags target `next` so a release candidate cannot move
            # `latest` on its own.
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            case "${GITHUB_REF_NAME}" in
              *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT" ;;
              *)   echo "dist_tag=latest" >> "$GITHUB_OUTPUT" ;;
            esac
          fi
      # The single step whose environment carries the credential. It reports
      # presence with `test -n` and prints `npm whoami` — never the token, and
      # never the environment. The publish script passes `--ignore-scripts`, so
      # no package lifecycle script runs while the token is in scope.
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          MARS_PUBLISH_PROVENANCE: "1"
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
          DIST_TAG: ${{ steps.mode.outputs.dist_tag }}
        shell: bash
        run: |
          set -uo pipefail
          if [ -n "${NPM_TOKEN:-}" ]; then echo "NPM_TOKEN: present"; else echo "NPM_TOKEN: missing"; fi
          echo "npm whoami: $(npm whoami 2>&1 || echo '<failed>')"
          if [ "${DRY_RUN}" = "true" ]; then
            echo "Dry run: packing and validating only, nothing is published."
            bun scripts/ci-release-publish.ts --dry-run --dist-tag "$DIST_TAG"
            exit $?
          fi
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::warning title=npm publish skipped::NPM_TOKEN is missing, so nothing was published. Configure the secret and re-run."
            exit 0
          fi
          bun scripts/ci-release-publish.ts --dist-tag "$DIST_TAG"
